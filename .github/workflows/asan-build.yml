name: Asan 0.7 cinematic library and episode queue
on:
  push:
    branches: [asan-film-torrents-intro]
    paths: ['source/Asan-torrent-patch.zip', '.github/workflows/asan-torrent-build.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asan-torrent-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[mac probe]') }}
    runs-on: macos-26-intel
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: project
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore reviewed source
        working-directory: .
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, pathlib, shutil, stat, zipfile
          parts = sorted(pathlib.Path('.transfer').glob('Asan-source.part-*.b64'))
          assert len(parts) == 6
          base = base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True)
          assert hashlib.sha256(base).hexdigest() == 'daee692f4219ae2f17ec0fb6b7e9ef01e57a7a51e8901279d52f2e4fd6a3a93b'
          patch = pathlib.Path('source/Asan-torrent-patch.zip').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == 'a5d1f267e276bba9c7828369b532aec3ba1c905c6027f77356999fabf14d522c'
          target = pathlib.Path('project').resolve()
          target.mkdir(exist_ok=True)
          manifest = None
          for payload in (base, patch):
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  assert archive.testzip() is None
                  for entry in archive.infolist():
                      if entry.filename == '.asan-source-manifest.json':
                          manifest = json.loads(archive.read(entry))
                          continue
                      destination = (target / entry.filename).resolve()
                      assert destination.is_relative_to(target)
                      assert not stat.S_ISLNK(entry.external_attr >> 16)
                      archive.extract(entry, target)
          shutil.copyfile(target/'App/Assets.xcassets/AsanHeart.imageset/heart.png', target/'App/AsanInstallPreview.png')
          assert manifest
          for name, expected in manifest.items():
              actual = (target / name).resolve()
              assert actual.is_relative_to(target)
              assert hashlib.sha256(actual.read_bytes()).hexdigest() == expected, name
          print('Verified exact source manifest: %s files' % len(manifest))
          PY
      - uses: actions/cache@v4
        with:
          path: project/.torrent-build
          key: torrent-v2-all-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project/Native/**', 'project/scripts/build-torrent-engine.sh') }}
          restore-keys: |
            torrent-v2-all-${{ runner.os }}-${{ runner.arch }}-
            torrent-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Build embedded native runtime
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/build-torrent-engine.sh 2>&1 | tee artifacts/torrent-native-build.log
      - name: Prepare official local video player and original test clip
        run: |
          set -euo pipefail
          python3 scripts/prepare-tvos-vlc.py 2>&1 | tee artifacts/vlc-prepare.log
          swift scripts/make-torrent-preview.swift App/PreviewClip.mp4 2>&1 | tee artifacts/preview-clip.log
      - name: Test actual torrent transfer, verification and deletion
        id: torrent_transfer
        continue-on-error: true
        run: |
          set -euo pipefail
          cmake -S Native/TorrentBridge -B .torrent-build/macos-x86_64 -DASAN_NATIVE_TESTS=ON
          cmake --build .torrent-build/macos-x86_64 --config Release --target AsanTorrentIntegrationTests -- -quiet CODE_SIGNING_ALLOWED=NO
          ctest --test-dir .torrent-build/macos-x86_64 -C Release --output-on-failure 2>&1 | tee artifacts/torrent-integration.log
      - name: Test core policies and build tvOS Simulator
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v 2>&1 | tee artifacts/packaging-tests.log
          bash scripts/check-macos.sh 2>&1 | tee artifacts/check-macos.log
      - name: Probe actual public torrent search without downloading
        continue-on-error: true
        env:
          ASAN_LIVE_TORRENT_SEARCH: '1'
        run: |
          set -euo pipefail
          xcrun swift test --filter TorrentSearchTests.testLivePublicSearchOnlyWhenExplicitlyEnabled 2>&1 | tee artifacts/torrent-live-search.log
      - name: Check focus, navigation and actual native screenshots
        run: |
          set -euo pipefail
          python3 scripts/capture-tvos-preview.py 2>&1 | tee artifacts/preview-capture.log
      - name: Archive Apple TV device app
        id: device_archive
        run: |
          set -euo pipefail
          xcodebuild archive -project KinoHD.xcodeproj -scheme KinoHD -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -archivePath .build/KinoHD.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= 2>&1 | tee artifacts/device-archive.log
          python3 scripts/package-unsigned-ipa.py 2>&1 | tee artifacts/package-ipa.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: project/.torrent-build
          key: torrent-v2-all-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project/Native/**', 'project/scripts/build-torrent-engine.sh') }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Asan-0.7-diagnostics
          path: project/artifacts/*.log
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Asan-0.7-native-preview
          path: |
            project/artifacts/preview/
            project/.build/Asan-UI.xcresult/
            project/.build/Asan-UI-preflight.xcresult/
            project/.build/Asan-UI-preflight-*/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.device_archive.outcome == 'success' }}
        with:
          name: Asan-0.7-device-IPA
          path: project/artifacts/KinoHD-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Require successful native integration
        if: always()
        env:
          TORRENT_TEST_OUTCOME: ${{ steps.torrent_transfer.outcome }}
        run: test "$TORRENT_TEST_OUTCOME" = success
